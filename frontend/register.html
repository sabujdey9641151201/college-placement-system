<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create student account · Campus Placement Portal</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body><header class="bar"><a class="brand" href="index.html">Campus Placement Portal</a><nav><a href="login.html">Sign in</a></nav></header><main class="auth"><h1>Create student account</h1><form id="register-form"><div class="field"><label>Full name</label><input name="name" required minlength="2" maxlength="100"></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password (12 characters minimum)</label><input type="password" name="password" minlength="12" required></div><div class="field"><label>Roll number</label><input name="rollNo" required></div><div class="field"><label>Department</label><input name="department" required></div><div class="field"><label>Graduation year</label><input type="number" name="graduationYear" min="2000" required></div><div id="message"></div><button>Create account</button></form></main></body></html>
